name: Model tests

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  weights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Cache weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/colorizer
          key: weights-${{ hashFiles('src/colorizer/models/*.py', 'tools/export_onnx/*.py') }}
      # No hosted ONNX builds yet: export from the official checkpoints (CPU torch).
      - name: Export ONNX models
        run: |
          if [ ! -f ~/.cache/colorizer/zhang_siggraph17.onnx ]; then
            uv run --locked --extra cpu --group export python tools/export_onnx/zhang.py
          fi
          if [ ! -f ~/.cache/colorizer/deoldify_stable.onnx ]; then
            uv run --locked --extra cpu --group export python tools/export_onnx/deoldify.py
          fi
          if [ ! -f ~/.cache/colorizer/ddcolor_large.onnx ]; then
            uv run --locked --extra cpu --group export python tools/export_onnx/ddcolor.py
          fi
          if [ ! -f ~/.cache/colorizer/realesrgan_general_x4v3.onnx ]; then
            uv run --locked --extra cpu --group export python tools/export_onnx/realesrgan.py
          fi
          # The exported ONNX files are what the tests need; drop the checkpoints so the
          # cache stays well under the 10 GB per-repo limit.
          rm -f ~/.cache/colorizer/*.pth ~/.cache/colorizer/*.bin
      - run: uv run --locked --extra cpu pytest -m weights
        env:
          COLORIZER_TEST_WEIGHTS: "1"
